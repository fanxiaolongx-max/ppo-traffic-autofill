name: Build packages and release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-extensions:
    name: Chrome and Edge packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify tag matches extension version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          test "v${manifest_version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version v${manifest_version}."
            exit 1
          }
      - name: Validate and package both stores
        run: ./package_extension.sh --no-bump
      - name: Collect extension release files
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          mkdir -p release-assets
          cp "dist/ppo-traffic-autofill-chrome-v${version}.zip" release-assets/
          cp "dist/ppo-traffic-autofill-edge-v${version}.zip" release-assets/
      - uses: actions/upload-artifact@v5
        with:
          name: browser-extensions
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  macos-app:
    name: macOS universal app
    runs-on: macos-latest
    env:
      SIGN_MAC_APP: ${{ secrets.MAC_CSC_LINK != '' }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Verify desktop and extension versions match
        shell: bash
        run: |
          app_version="$(node -p "require('./package.json').version")"
          extension_version="$(node -p "require('../manifest.json').version")"
          test "${app_version}" = "${extension_version}" || {
            echo "Desktop version ${app_version} does not match extension version ${extension_version}."
            exit 1
          }
      - name: Install dependencies
        run: npm ci
      - name: Run desktop tests
        run: npm test
      - name: Build unsigned universal DMG and ZIP
        if: env.SIGN_MAC_APP != 'true'
        run: npx electron-builder --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Build signed universal DMG and ZIP
        if: env.SIGN_MAC_APP == 'true'
        run: npx electron-builder --mac --universal --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Collect macOS release files
        shell: bash
        run: |
          app_version="$(node -p "require('./package.json').version")"
          dmg="$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          zip="$(find dist -maxdepth 1 -type f -name '*-mac.zip' -print -quit)"
          test -n "${dmg}" && test -n "${zip}"
          mkdir -p release-assets
          cp "${dmg}" "release-assets/ppo-query-hub-macos-universal-v${app_version}.dmg"
          cp "${zip}" "release-assets/ppo-query-hub-macos-universal-v${app_version}.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: macos-universal
          path: desktop-app/release-assets/*
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [browser-extensions, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find release-assets -maxdepth 1 -type f -print | sort)
          test "${#files[@]}" -eq 4
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "PPO Traffic Autofill ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
