name: Build packages and release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    # These files are shipped by the independently signed core workflow. A
    # core-only change must not rebuild the stable Electron shell.
    paths-ignore:
      - '.github/workflows/build-release.yml'
      - 'README.md'
      - 'desktop-app/README.md'
      - 'desktop-app/.env.example'
      - 'desktop-app/test/**'
      - 'desktop-app/core-version.json'
      - 'desktop-app/public/**'
      - 'desktop-app/src/admin-auth.js'
      - 'desktop-app/src/client-ip.js'
      - 'desktop-app/src/config.js'
      - 'desktop-app/src/db.js'
      - 'desktop-app/src/feedback-attachments.js'
      - 'desktop-app/src/ip-geo.js'
      - 'desktop-app/src/logger.js'
      - 'desktop-app/src/official-error.js'
      - 'desktop-app/src/query-driver.js'
      - 'desktop-app/src/queue.js'
      - 'desktop-app/src/rate-limit.js'
      - 'desktop-app/src/result-parser.js'
      - 'desktop-app/src/secret-store.js'
      - 'desktop-app/src/server.js'
      - 'desktop-app/src/sms-notifier.js'
      - 'desktop-app/src/validation.js'
      - 'desktop-app/scripts/package-core.mjs'
      - 'desktop-app/scripts/verify-core-package.mjs'
      - 'scripts/bump-core-version.mjs'
      - '.github/workflows/core-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-version:
    name: Prepare unified release version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.prepare.outputs.commit_sha }}
      version: ${{ steps.prepare.outputs.version }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Bump patch version on main pushes
        id: prepare
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            current_version="$(node -p "require('./manifest.json').version")"
            previous_version="$(git show HEAD^:manifest.json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))" || true)"
            if [[ -n "${previous_version}" && "${current_version}" != "${previous_version}" ]]; then
              version="${current_version}"
              release_tag="v${version}"
            else
              release_tag="v$(node scripts/bump-version.mjs --next)"
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
              git fetch origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
              git checkout --detach "${release_tag}"
              version="$(node -p "require('./manifest.json').version")"
            elif [[ -n "${version}" ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "${release_tag}" -m "${release_tag}"
              git push origin "${release_tag}"
            else
              version="$(node scripts/bump-version.mjs)"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -- manifest.json desktop-app/package.json desktop-app/package-lock.json README.md desktop-app/README.md
              git commit -m "chore: bump release version to ${release_tag} [skip ci]"
              git tag -a "${release_tag}" -m "${release_tag}"
              git push origin HEAD:main "${release_tag}"
            fi
          else
            version="$(node -p "require('./manifest.json').version")"
            release_tag=""
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              release_tag="${GITHUB_REF_NAME}"
              test "v${version}" = "${release_tag}"
            fi
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

  browser-extensions:
    name: Chrome and Edge packages
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-version.outputs.commit_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify prepared release version
        if: needs.prepare-version.outputs.release_tag != ''
        shell: bash
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          test "v${manifest_version}" = "${{ needs.prepare-version.outputs.release_tag }}" || {
            echo "Prepared tag ${{ needs.prepare-version.outputs.release_tag }} does not match manifest version v${manifest_version}."
            exit 1
          }
      - name: Validate and package both stores
        run: ./package_extension.sh --no-bump
      - name: Collect extension release files
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          mkdir -p release-assets
          cp "dist/ppo-traffic-autofill-chrome-v${version}.zip" release-assets/
          cp "dist/ppo-traffic-autofill-edge-v${version}.zip" release-assets/
      - uses: actions/upload-artifact@v5
        with:
          name: browser-extensions
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  macos-app:
    name: macOS universal app
    needs: prepare-version
    runs-on: macos-latest
    env:
      SIGN_MAC_APP: ${{ secrets.MAC_CSC_LINK != '' }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-version.outputs.commit_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Verify desktop and extension versions match
        shell: bash
        run: |
          app_version="$(node -p "require('./package.json').version")"
          extension_version="$(node -p "require('../manifest.json').version")"
          test "${app_version}" = "${extension_version}" || {
            echo "Desktop version ${app_version} does not match extension version ${extension_version}."
            exit 1
          }
      - name: Install dependencies
        run: npm ci
      - name: Run desktop tests
        run: npm test
      - name: Build unsigned universal DMG and ZIP
        if: env.SIGN_MAC_APP != 'true'
        run: npx electron-builder --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Build signed universal DMG and ZIP
        if: env.SIGN_MAC_APP == 'true'
        run: npx electron-builder --mac --universal --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Collect macOS release files
        shell: bash
        run: |
          app_version="$(node -p "require('./package.json').version")"
          dmg="$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          zip="$(find dist -maxdepth 1 -type f -name '*-mac.zip' -print -quit)"
          test -n "${dmg}" && test -n "${zip}"
          mkdir -p release-assets
          cp "${dmg}" "release-assets/ppo-query-hub-macos-universal-v${app_version}.dmg"
          cp "${zip}" "release-assets/ppo-query-hub-macos-universal-v${app_version}.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: macos-universal
          path: desktop-app/release-assets/*
          if-no-files-found: error
          retention-days: 30

  query-core:
    name: Signed query core package
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-version.outputs.commit_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Install core verifier dependencies
        working-directory: desktop-app
        run: npm ci
      - name: Build signed hot-update core
        working-directory: desktop-app
        env:
          CORE_SIGNING_PRIVATE_KEY: ${{ secrets.CORE_SIGNING_PRIVATE_KEY }}
        run: npm run build:core
      - name: Verify signature, compatibility and file hashes
        working-directory: desktop-app
        run: npm run verify:core
      - uses: actions/upload-artifact@v5
        with:
          name: query-core
          path: desktop-app/dist-core/*.zip
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish GitHub Release
    if: needs.prepare-version.outputs.release_tag != ''
    needs: [prepare-version, browser-extensions, macos-app, query-core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.release_tag }}
        run: |
          mapfile -t files < <(find release-assets -maxdepth 1 -type f -print | sort)
          test "${#files[@]}" -eq 5
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" "${files[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "PPO Traffic Autofill ${RELEASE_TAG}" \
              --generate-notes
          fi
